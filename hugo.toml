baseurl = "https://sebastienpicard.com/"
title = "Sebastien's Webpage"
theme = "hugo-haku"
locale = "en"
# defaultcontentlanguage = "en"

[markup.highlight]
style = 'catppuccin-frappe'

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['$$', '$$'], ['\[', '\]']]
inline = [['$', '$'], ['\(', '\)']]

[params]
  info = 'Hi, I’m Sebastien〜'
  bio = "I'm a second-year mathematics student at the **University of Toronto**. I'm passionate about research in mathematics and mathematics in education. Please contact me if you wish to talk or collaborate. ***Welcome to my webpage!***"
  description = "Sebastien’s webpage on mathematics and education."
  listTitle = "**What's new**:"
  # random home page quote: list them in data/quotes.json (delete the file to disable)
  avatar = "/images/mypfp.jpg"
  tileClock = true  # show the current unix time as mahjong tiles

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

